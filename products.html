<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Our Products</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
    }

    header {
      background: #222;
      color: white;
      padding: 20px;
      text-align: center;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 40px 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card h2 {
      margin-bottom: 15px;
    }

    .card p {
      font-size: 14px;
      margin-bottom: 20px;
      color: #555;
    }

    .card button {
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background: #4CAF50;
      color: white;
      font-size: 14px;
    }

    .card button:hover {
      opacity: 0.9;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #333;
      color: white;
      margin-top: 40px;
    }
  </style>
</head>

<body>

<header>
  🚀 Our Products
</header>

<main>

  <!-- Punch In Product -->
  <div class="card">
    <h2>⏱️ Punch In / Out</h2>
    <p>Calculate your total working hours easily with multiple sessions.</p>
    <button onclick="location.href='punch.html'">
      Open Tool
    </button>
  </div>

  <!-- Task Manager Product -->
  <div class="card">
    <h2>📝 Task Management System</h2>
    <p>Manage, track and organize your daily tasks efficiently.</p>
    <button onclick="location.href='task.html'">
      Open Tool
    </button>
  </div>

</main>

<footer>
  &copy; 2026 My Website
</footer>

</body>
</html>
